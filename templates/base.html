<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>{% block title %}Main Detailed Diagnostic Report{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  </head>
  <body>
    <header>
      <div class="header-left">
        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="Logo" height="40">
      </div>
      <div class="header-right">
        <h1>Detailed Diagnostic Report</h1>
      </div>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      <p>Generated by AI Diagnostic System</p>
    </footer>
  </body>
</html>
